<h2 style="margin-bottom: 20px;">Danh sách bài thi đang mở</h2>

<div nz-row [nzGutter]="16">
  @for (exam of openExams; track exam.id) {
    <div nz-col [nzSpan]="12" style="margin-bottom: 16px;">
      <nz-card [nzTitle]="exam.title" [nzExtra]="extraTemplate">
        <p>Số câu hỏi: {{ exam.questions?.length || 0 }}</p>
        <p>Thời gian làm bài: {{ exam.duration }} phút</p>
        <p>Trạng thái: <nz-tag nzColor="green">Đang mở</nz-tag></p>
      </nz-card>
      
      <ng-template #extraTemplate>
        <button nz-button nzType="link" [routerLink]="['/student/exam', exam.id]">
          Vào thi ngay
        </button>
      </ng-template>
    </div>
  } @empty {
    <div nz-col [nzSpan]="24" style="text-align: center; margin-top: 40px;">
      <nz-empty nzNotFoundContent="Hiện tại không có bài thi nào đang mở!"></nz-empty>
    </div>
  }
</div>
